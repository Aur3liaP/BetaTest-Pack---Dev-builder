services:
  kong-database:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - kong_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ex5_app-network

  kong-migration:
    image: kong:3.4
    command: kong migrations bootstrap
    environment:
      - KONG_DATABASE=${KONG_DATABASE}
      - KONG_PG_HOST=${KONG_PG_HOST}
      - KONG_PG_USER=${POSTGRES_USER}
      - KONG_PG_PASSWORD=${POSTGRES_PASSWORD}
      - KONG_PG_DATABASE=${POSTGRES_DB}
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - ex5_app-network

  kong:
    image: kong:3.4
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    environment:
      - KONG_DATABASE=${KONG_DATABASE}
      - KONG_PG_HOST=${KONG_PG_HOST}
      - KONG_PG_USER=${POSTGRES_USER}
      - KONG_PG_PASSWORD=${POSTGRES_PASSWORD}
      - KONG_PG_DATABASE=${POSTGRES_DB}
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10        
    networks:
      - ex5_app-network

  kong-config:
    image: kong/deck:v1.66.0
    command: gateway sync /config/kong.yml --kong-addr=http://kong:8001
    volumes:
      - ./config/kong.yml:/config/kong.yml:ro
    depends_on:
      kong:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - ex5_app-network

  user-service:
    image: nginx:alpine
    volumes:
      - ./services/user-service/nginx.conf:/etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://${APP_URL}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3      
    networks:
      - ex5_app-network

  product-service:
    image: nginx:alpine
    volumes:
      - ./services/product-service/nginx.conf:/etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://${APP_URL}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ex5_app-network

  order-service:
    image: nginx:alpine
    volumes:
      - ./services/order-service/nginx.conf:/etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://${APP_URL}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3      
    networks:
      - ex5_app-network

  # redis:
